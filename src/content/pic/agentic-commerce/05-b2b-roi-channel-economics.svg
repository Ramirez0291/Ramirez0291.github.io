<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 840" width="920" height="840" role="img" aria-labelledby="t5 d5">
  <title id="t5">2B自主采购率先兑现硬核ROI，同时AI渠道正重塑商家获客与抽佣账本</title>
  <desc id="d5">2026年全球企业级AI采购里程碑、经验证的效率提升与议价降本指标，以及基于50美元客单价模型的通道成本结构对比</desc>
  <style>
    :root {
      --bg: #0c0e0d;
      --panel: #131614;
      --panel2: #181c19;
      --fg: #d6dbd4;
      --bright: #f3f5f1;
      --muted: #8a928b;
      --line: #282e29;
      --grid: #1e231f;
      --amber: #f2b33d;
      --green: #7bd88f;
      --red: #ff7a70;
      --cyan: #6cc4d9;
      --gray-bar: #6b736c;
      --sans: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f1e8;
        --panel: #ebe7da;
        --panel2: #e4dfd0;
        --fg: #2a2d27;
        --bright: #11130f;
        --muted: #5d6156;
        --line: #cfc8b5;
        --grid: #dcd6c6;
        --amber: #9a5800;
        --green: #226a31;
        --red: #b42318;
        --cyan: #11697f;
        --gray-bar: #8d8a7e;
      }
    }
    :where(text) { font-family: var(--sans); fill: var(--fg); }
    .mono { font-family: var(--mono); }
    .title { font-size: 20px; font-weight: 700; fill: var(--bright); }
    .sub { font-size: 13px; fill: var(--muted); }
    .sec { font-size: 15px; font-weight: 700; fill: var(--bright); }
    .sec-tag { font-family: var(--mono); font-size: 12px; font-weight: 700; fill: var(--bg); }
    .kpi-lbl { font-size: 12.5px; fill: var(--muted); }
    .kpi-val { font-family: var(--mono); font-size: 30px; font-weight: 700; }
    .kpi-note { font-size: 11.5px; fill: var(--muted); }
    .lbl { font-size: 13px; fill: var(--bright); font-weight: 600; }
    .lbl-s { font-size: 11px; fill: var(--muted); }
    .val { font-family: var(--mono); font-size: 13px; font-weight: 700; }
    .axis { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
    .foot { font-size: 11.5px; fill: var(--muted); }
    .c-cyan { fill: var(--cyan); }
    .c-amber { fill: var(--amber); }
    .c-green { fill: var(--green); }
    .c-red { fill: var(--red); }
    .c-blue { fill: var(--blue); }
    .c-bright { fill: var(--bright); }
    .c-muted { fill: var(--muted); }
    .c-fg { fill: var(--fg); }
    .c-onbar { fill: var(--on-bar, #0c0e0d); }
  </style>

  <rect width="920" height="840" rx="8" fill="var(--bg)" stroke="var(--line)"/>

  <!-- Header -->
  <text x="32" y="42" class="title">2B 自主采购率先兑现硬核 ROI，同时 AI 渠道正重塑商家获客与抽佣账本</text>
  <text x="32" y="64" class="sub">2026 年全球企业级 AI 采购规模里程碑、降本增效实证指标，以及 2C/DTC 通道成本结构示意对比</text>
  <line x1="32" y1="80" x2="888" y2="80" stroke="var(--line)" stroke-dasharray="4 4"/>

  <!-- Section 1: 4 B2B Milestone KPI Cards -->
  <g transform="translate(32, 98)">
    <rect x="0" y="0" width="22" height="20" rx="3" fill="var(--cyan)"/>
    <text x="11" y="14.5" text-anchor="middle" class="sec-tag">1</text>
    <text x="30" y="15" class="sec">2026 年全球 B2B 自主采购规模里程碑</text>

    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="202" height="106" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <rect x="0" y="0" width="202" height="3" rx="1.5" fill="var(--cyan)"/>
      <text x="14" y="26" class="kpi-lbl">Amazon Business 年化 GMV</text>
      <text x="14" y="66" class="kpi-val c-cyan">$600亿</text>
      <text x="14" y="90" class="kpi-note">1,100 万+ 机构 · 97 家财富百强</text>

      <rect x="218" y="0" width="202" height="106" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <rect x="218" y="0" width="202" height="3" rx="1.5" fill="var(--amber)"/>
      <text x="232" y="26" class="kpi-lbl">1688 AI 发起采购需求占比</text>
      <text x="232" y="66" class="kpi-val c-amber">40%</text>
      <text x="232" y="90" class="kpi-note">AI 日均调度匹配 29 万家源头工厂</text>

      <rect x="436" y="0" width="202" height="106" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <rect x="436" y="0" width="202" height="3" rx="1.5" fill="var(--green)"/>
      <text x="450" y="26" class="kpi-lbl">阿里 Accio Work 首月企业</text>
      <text x="450" y="66" class="kpi-val c-green">23万家</text>
      <text x="450" y="90" class="kpi-note">2026 年 3 月上线 1 个月实绩</text>

      <rect x="654" y="0" width="202" height="106" rx="6" fill="var(--panel)" stroke="var(--line)"/>
      <rect x="654" y="0" width="202" height="3" rx="1.5" fill="var(--cyan)"/>
      <text x="668" y="26" class="kpi-lbl">Pactum AI 管理采购支出</text>
      <text x="668" y="66" class="kpi-val c-cyan">$550亿</text>
      <text x="668" y="90" class="kpi-note">官方披露服务 50+ 全球 2000 强</text>
    </g>
  </g>

  <line x1="32" y1="254" x2="888" y2="254" stroke="var(--line)" stroke-dasharray="4 4"/>

  <!-- Section 2: B2B Efficiency & Savings Bars -->
  <g transform="translate(32, 272)">
    <rect x="0" y="0" width="22" height="20" rx="3" fill="var(--green)"/>
    <text x="11" y="14.5" text-anchor="middle" class="sec-tag">2</text>
    <text x="30" y="15" class="sec">2026 年 B2B AI 自主采购效率提升与议价降本指标（%）</text>

    <rect x="526" y="4" width="11" height="11" rx="2" fill="var(--cyan)"/>
    <text x="542" y="14" class="kpi-note">流程自动化</text>
    <rect x="628" y="4" width="11" height="11" rx="2" fill="var(--amber)"/>
    <text x="644" y="14" class="kpi-note">二次议价胜率</text>
    <rect x="742" y="4" width="11" height="11" rx="2" fill="var(--green)"/>
    <text x="758" y="14" class="kpi-note">直接采购降本</text>

    <!-- Chart x: 265..815 (width=550 -> 100% => 5.5 px/%) -->
    <g transform="translate(0, 34)">
      <line x1="265" y1="0" x2="265" y2="205" stroke="var(--line)"/>
      <line x1="402.5" y1="0" x2="402.5" y2="205" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="540" y1="0" x2="540" y2="205" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="677.5" y1="0" x2="677.5" y2="205" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="815" y1="0" x2="815" y2="205" stroke="var(--grid)" stroke-dasharray="3 3"/>

      <!-- Row 1: 90% -> 495 -->
      <text x="252" y="16" text-anchor="end" class="lbl">请购申请周期缩减</text>
      <text x="252" y="31" text-anchor="end" class="lbl-s">Pactum Intake Agent</text>
      <rect x="265" y="7" width="495" height="22" rx="3" fill="var(--cyan)"/>
      <text x="769" y="23" class="val c-cyan">90%</text>

      <!-- Row 2: 70% -> 385 -->
      <text x="252" y="57" text-anchor="end" class="lbl">构想到询盘人工流程自动化</text>
      <text x="252" y="72" text-anchor="end" class="lbl-s">阿里 Accio Agent</text>
      <rect x="265" y="48" width="385" height="22" rx="3" fill="var(--cyan)" opacity="0.82"/>
      <text x="659" y="64" class="val c-cyan">70%</text>

      <!-- Row 3: 58% -> 319 -->
      <text x="252" y="98" text-anchor="end" class="lbl">已截标 RFx 二次议价获更优报价</text>
      <text x="252" y="113" text-anchor="end" class="lbl-s">Pactum Post-Sourcing Agent</text>
      <rect x="265" y="89" width="319" height="22" rx="3" fill="var(--amber)"/>
      <text x="593" y="105" class="val c-amber">58%</text>

      <!-- Row 4: 11% -> 60.5 -->
      <text x="252" y="139" text-anchor="end" class="lbl">竞争性战术采购平均成本降幅</text>
      <text x="252" y="154" text-anchor="end" class="lbl-s">Pactum Tactical Sourcing</text>
      <rect x="265" y="130" width="61" height="22" rx="3" fill="var(--green)"/>
      <text x="335" y="146" class="val c-green">11%</text>

      <!-- Row 5: 4.7% -> 26 -->
      <text x="252" y="180" text-anchor="end" class="lbl">单一来源自主议价平均成本降幅</text>
      <text x="252" y="195" text-anchor="end" class="lbl-s">Pactum Single-Source</text>
      <rect x="265" y="171" width="26" height="22" rx="3" fill="var(--green)" opacity="0.82"/>
      <text x="300" y="187" class="val c-green">4.7%</text>

      <text x="265" y="222" text-anchor="middle" class="axis">0%</text>
      <text x="402.5" y="222" text-anchor="middle" class="axis">25%</text>
      <text x="540" y="222" text-anchor="middle" class="axis">50%</text>
      <text x="677.5" y="222" text-anchor="middle" class="axis">75%</text>
      <text x="815" y="222" text-anchor="middle" class="axis">100%</text>
    </g>
  </g>

  <line x1="32" y1="546" x2="888" y2="546" stroke="var(--line)" stroke-dasharray="4 4"/>

  <!-- Section 3: Channel Cost Comparison ($50 AOV) -->
  <g transform="translate(32, 564)">
    <rect x="0" y="0" width="22" height="20" rx="3" fill="var(--amber)"/>
    <text x="11" y="14.5" text-anchor="middle" class="sec-tag">3</text>
    <text x="30" y="15" class="sec">通道成本与获客抽佣结构示意对比（基于 $50 客单价模型，占 GMV %）</text>

    <!-- Chart x: 265..770 (width=505 -> 35% => 14.43 px/%) -->
    <g transform="translate(0, 32)">
      <line x1="265" y1="0" x2="265" y2="162" stroke="var(--line)"/>
      <line x1="409" y1="0" x2="409" y2="162" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="554" y1="0" x2="554" y2="162" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="698" y1="0" x2="698" y2="162" stroke="var(--grid)" stroke-dasharray="3 3"/>
      <line x1="770" y1="0" x2="770" y2="162" stroke="var(--grid)" stroke-dasharray="3 3"/>

      <!-- 30.0% -> 433 -->
      <text x="252" y="16" text-anchor="end" class="lbl">传统 Amazon（佣金 + 站内广告）</text>
      <text x="252" y="31" text-anchor="end" class="lbl-s">15% 佣金 + 15% PPC 测算</text>
      <rect x="265" y="7" width="433" height="22" rx="3" fill="var(--gray-bar)"/>
      <text x="706" y="23" class="val c-bright">30.0% ($15.00)</text>

      <!-- 15.0% -> 216.5 -->
      <text x="252" y="56" text-anchor="end" class="lbl">豆包电商高补贴档（双 11 混资）</text>
      <text x="252" y="71" text-anchor="end" class="lbl-s">10% 特定渠道佣金 + 5% 商家出资券</text>
      <rect x="265" y="47" width="217" height="22" rx="3" fill="var(--amber)"/>
      <text x="490" y="63" class="val c-amber">15.0% ($7.50)</text>

      <!-- 10.0% -> 144.3 -->
      <text x="252" y="96" text-anchor="end" class="lbl">豆包电商基准档（5% 基础类目）</text>
      <text x="252" y="111" text-anchor="end" class="lbl-s">5% 基础费 + 5% 特定渠道补充费</text>
      <rect x="265" y="87" width="144" height="22" rx="3" fill="var(--amber)" opacity="0.78"/>
      <text x="417" y="103" class="val c-amber">10.0% ($5.00)</text>

      <!-- 6.9% -> 99.6 -->
      <text x="252" y="136" text-anchor="end" class="lbl">独立站接入 OpenAI ACP（原费率）</text>
      <text x="252" y="151" text-anchor="end" class="lbl-s">4% ACP 费 + 2.9% Stripe 支付费</text>
      <rect x="265" y="127" width="100" height="22" rx="3" fill="var(--cyan)"/>
      <text x="373" y="143" class="val c-cyan">6.9% ($3.45)</text>

      <text x="265" y="178" text-anchor="middle" class="axis">0%</text>
      <text x="409" y="178" text-anchor="middle" class="axis">10%</text>
      <text x="554" y="178" text-anchor="middle" class="axis">20%</text>
      <text x="698" y="178" text-anchor="middle" class="axis">30%</text>
      <text x="770" y="178" text-anchor="middle" class="axis">35%</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="32" y="798" class="foot">注：底图为单笔 $50 客单价通道直扣示意，不含物流履约、退货损耗及独立站 GEO 内容建设投入；豆包食品类目叠加佣金低于 10%。</text>
  <text x="32" y="818" class="foot">数据来源：Amazon Business · 新浪财经 (1688) · Stellagent (Accio) · Pactum 官方披露 · 亿邦动力 · Ekamoira (ACP)</text>
</svg>
